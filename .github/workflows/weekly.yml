name: Weekly update

on:
  schedule:
    - cron: "0 13 * * 4"   # Thursday 13:00 UTC = 8am CDT / 7am CST: lines, props, freeze picks
    - cron: "0 15 * * 0"   # Sunday 15:00 UTC = 10am CDT / 9am CST: refresh game lines
    - cron: "0 14 * * 2"   # Tuesday 14:00 UTC: grade results, refresh backtest
  workflow_dispatch:
    inputs:
      mode:
        description: "thursday | sunday | grade | local"
        default: thursday

permissions:
  contents: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore nflverse cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-
      - name: Pick mode
        id: mode
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then m="${{ github.event.inputs.mode }}";
          elif [ "${{ github.event.schedule }}" = "0 13 * * 4" ]; then m=thursday;
          elif [ "${{ github.event.schedule }}" = "0 15 * * 0" ]; then m=sunday;
          else m=grade; fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: Run pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m pipeline.run --mode ${{ steps.mode.outputs.mode }}
      - name: Commit data
        run: |
          git config user.name "line-lab-bot"
          git config user.email "line-lab-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Data update (${{ steps.mode.outputs.mode }}) $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
